<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NOAMS: Risk &amp; Anomaly Monitoring for non-compliance." data-i18n-content="meta.description">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <script>
    (() => {
      const theme = localStorage.getItem("noams.theme");
      const language = localStorage.getItem("noams.language");
      document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
      document.documentElement.lang = language === "es" ? "es" : "en";
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/settings.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/rules.css') }}?v=3">
</head>
<body>
  {% block content %}{% endblock %}
  {% include "_settings_modal.html" %}
  <script src="{{ url_for('static', path='/js/i18n.js') }}?v=4" defer></script>
  <script src="{{ url_for('static', path='/js/main.js') }}" defer></script>
  <script src="{{ url_for('static', path='/js/settings.js') }}" defer></script>
  <script src="{{ url_for('static', path='/js/rules.js') }}?v=5" defer></script>
</body>
</html>
