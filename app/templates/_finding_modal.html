<dialog class="finding-modal" id="finding-modal" aria-labelledby="finding-detail-title">
  <div class="finding-detail">
    <div class="modal-heading">
      <div><p class="eyebrow" data-i18n="finding.deterministic">Deterministic finding</p><h2 id="finding-detail-title" data-i18n="finding.details">Finding Details</h2></div>
      <button class="icon-button" id="close-finding" type="button" aria-label="Close" data-i18n-aria-label="common.close">&times;</button>
    </div>
    <p class="deterministic-note" data-i18n="finding.note">This finding was generated by a deterministic rule.</p>
    <dl class="detail-grid" id="finding-detail-grid"></dl>
    <div class="evidence-block"><h3 data-i18n="finding.evidence">Technical Evidence Summary</h3><dl id="finding-evidence"></dl></div>
  </div>
</dialog>
